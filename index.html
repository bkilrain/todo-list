<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Ledger — todo list</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="glow glow-a" aria-hidden="true"></div>
<div class="glow glow-b" aria-hidden="true"></div>

<main class="board">
  <header class="masthead">
    <div class="brand">
      <h1>Ledger</h1>
      <p class="tagline">small things, kept</p>
    </div>

    <div class="meter">
      <div class="meter-track" role="progressbar" aria-label="Tasks completed"
           aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="meter">
        <span class="meter-fill" id="meter-fill"></span>
      </div>
      <p class="meter-label"><b id="done-count">0</b> of <span id="total-count">0</span> done</p>
    </div>
  </header>

  <form class="composer" id="composer" autocomplete="off">
    <label class="sr-only" for="new-todo">New todo</label>
    <input id="new-todo" name="todo" type="text" placeholder="What needs doing?"
           maxlength="240" spellcheck="false" autocapitalize="sentences">
    <button class="add-btn" type="submit">
      <span aria-hidden="true">+</span> Add
    </button>
  </form>

  <nav class="toolbar" aria-label="Filter todos">
    <div class="segmented">
      <button class="chip is-on" type="button" data-filter="active" aria-pressed="true">
        Active <span class="chip-count" data-count-for="active">0</span>
      </button>
      <button class="chip" type="button" data-filter="done" aria-pressed="false">
        Done <span class="chip-count" data-count-for="done">0</span>
      </button>
      <button class="chip" type="button" data-filter="all" aria-pressed="false">
        All <span class="chip-count" data-count-for="all">0</span>
      </button>
    </div>
    <p class="hint">press <kbd>/</kbd> to write</p>
  </nav>

  <p class="status" id="status" role="status" aria-live="polite"></p>

  <ul class="list" id="list"></ul>

  <p class="empty" id="empty" hidden></p>

  <footer class="foot">
    <span id="persistence">Saved in this browser.</span>
  </footer>
</main>

<script src="app.js"></script>
</body>
</html>
